<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>Khagram Insurance — Premium Tracker</title>
<style>
  :root{
    --bg:#FAF8F2; --surface:#FFFFFF; --ink:#1B2A2E; --ink-soft:#5B6B6C;
    --primary:#0F3D3E; --accent:#C08A28;
    --danger:#B23A34; --warn:#C9A227; --ok:#3F7D5C; --border:#E4DED0;
    --row-collected:#F4F8F5;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  .app{max-width:780px;margin:0 auto;min-height:100vh;background:var(--bg);}
  header{position:sticky;top:0;z-index:10;background:var(--primary);color:#fff;
    padding:calc(16px + env(safe-area-inset-top,0px)) 16px 14px;box-shadow:0 2px 10px rgba(15,61,62,0.25);}
  header h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:19px;margin:0 0 2px;}
  header .sub{font-size:11.5px;opacity:0.75;margin-bottom:12px;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .stat{background:rgba(255,255,255,0.08);border-radius:8px;padding:8px 10px;}
  .stat .n{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat .l{font-size:10px;opacity:0.8;}
  .controls{display:flex;gap:8px;flex-wrap:wrap;}
  .search{flex:1;min-width:140px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);
    border-radius:7px;padding:8px 10px;color:#fff;font-size:13.5px;}
  .search::placeholder{color:rgba(255,255,255,0.6);}
  .tabs{display:flex;gap:6px;}
  .tab{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;
    padding:7px 12px;border-radius:7px;font-size:12.5px;cursor:pointer;white-space:nowrap;}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#1B2A2E;font-weight:600;}
  main{padding:12px 12px 40px;}
  .empty{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:14px;}
  .fcard{background:var(--surface);border:1px solid var(--border);border-left-width:4px;border-radius:9px;
    margin-bottom:10px;overflow:hidden;}
  .fcard.severe{border-left-color:var(--danger);}
  .fcard.overdue{border-left-color:var(--warn);}
  .fcard.week{border-left-color:var(--ok);}
  .fcard.month{border-left-color:#7FA6B5;}
  .fcard.done{border-left-color:var(--ok);opacity:0.7;}
  .fhead{padding:12px 13px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer;}
  .fhead:active{background:rgba(0,0,0,0.02);}
  .fname{font-weight:700;font-size:14.5px;}
  .fmeta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .famt{font-weight:700;font-size:15.5px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;}
  .fcount{font-size:10.5px;color:var(--ink-soft);text-align:right;margin-top:2px;}
  .badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;margin-top:5px;}
  .badge.severe{background:var(--danger);color:#fff;}
  .badge.overdue{background:var(--warn);color:#3a2d05;}
  .badge.week{background:var(--ok);color:#fff;}
  .badge.month{background:#7FA6B5;color:#fff;}
  .badge.done{background:var(--ok);color:#fff;}
  .fbody{border-top:1px solid var(--border);background:#FCFBF8;}
  .prow{padding:10px 13px;border-bottom:1px dashed var(--border);}
  .prow:last-child{border-bottom:none;}
  .prow.collected{background:var(--row-collected);}
  .prow-top{display:flex;justify-content:space-between;gap:8px;}
  .pname{font-weight:600;font-size:13px;}
  .pmeta{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}
  .pamt{font-weight:700;font-size:14px;white-space:nowrap;}
  .prow-actions{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:6px;}
  .ppolicyno{font-size:10.5px;color:var(--ink-soft);}
  button.btn{border:none;border-radius:7px;padding:6px 10px;font-size:11.5px;font-weight:600;cursor:pointer;}
  .btn-collect{background:var(--primary);color:#fff;}
  .btn-undo{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .collected-tag{font-size:11px;color:var(--ok);font-weight:600;}
  .collect-panel{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:6px;}
  .collect-panel label{font-size:10.5px;color:var(--ink-soft);font-weight:600;}
  .collect-panel input,.collect-panel select{padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;}
  .confirm-row{display:flex;gap:6px;}
  .btn-confirm{background:var(--ok);color:#fff;flex:1;}
  .btn-cancel{background:transparent;border:1px solid var(--border);color:var(--ink-soft);}
  .factions{display:flex;gap:6px;padding:10px 13px;border-top:1px solid var(--border);background:#fff;}
  .factions .btn{flex:1;text-align:center;background:var(--surface);border:1px solid var(--border);color:var(--ink);}
  .factions .btn.wa{background:#e9f5ee;border-color:#bfe3cf;color:var(--ok);}
  .sync-note{text-align:center;font-size:10.5px;color:var(--ink-soft);padding:10px 0 0;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:22px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,0.25);
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
  .toast.show{opacity:1;}
  .loading{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .sync-banner{font-size:11px;padding:7px 10px;border-radius:7px;margin-bottom:10px;line-height:1.4;}
  .sync-banner.ok{background:rgba(63,125,92,0.25);color:#d7ecdf;}
  .sync-banner.checking{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);}
  .sync-banner.bad{background:rgba(178,58,52,0.9);color:#fff;font-weight:600;}
  .setup-screen{max-width:600px;margin:40px auto;padding:24px;background:#fff;border-radius:10px;border:1px solid var(--border);}
  .setup-screen h2{font-family:Georgia,serif;}
  .setup-screen code{background:#f0ede4;padding:2px 6px;border-radius:4px;font-size:13px;}
  .setup-screen pre{background:#1B2A2E;color:#e8e8e8;padding:14px;border-radius:8px;overflow-x:auto;font-size:12px;}
  .verify-note{font-size:10.5px;color:#8a5a00;background:#FFF4D6;border-radius:6px;padding:5px 8px;margin-top:6px;line-height:1.35;}
  .prow.verify{background:#FFFBEF;}
</style>

// ---- Late fee (rule fitted from pre-2014 amounts in the LIC outstanding list) ----
// fee = round-half-up( premium x 11.2% / 12 x months_late ); premium shown in the app is never altered.
// Grace: up to the same date next month (15 days for monthly / SSS mode) -> no fee.
// After grace: months_late = whole months since due date, +1 once 15 or more days of the next month have passed (min 1).
const LATE_RATE_PCT_X10 = 112; // 11.2 % p.a.
function utcDay(y,m,d){ return Date.UTC(y,m,d); }
function parseDue(s){ const p=(s||"").split('-').map(Number); return utcDay(2000+p[2], p[1]-1, p[0]); }
function addMonthsUTC(ms, n, baseDay){
  const d = new Date(ms); const y = d.getUTCFullYear(), m = d.getUTCMonth() + n;
  const last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  return utcDay(y, m, Math.min(baseDay, last));
}
function lateMonths(p, payMs){
  const due = parseDue(p.fupDate); const baseDay = new Date(due).getUTCDate();
  const graceEnd = (p.mode === 'Mly' || p.mode === 'SSS') ? due + 15*86400000 : addMonthsUTC(due, 1, baseDay);
  if(payMs <= graceEnd) return 0;
  let m = 0;
  while(addMonthsUTC(due, m+1, baseDay) <= payMs) m++;
  const r = Math.round((payMs - addMonthsUTC(due, m, baseDay)) / 86400000);
  return Math.max(m + (r >= 15 ? 1 : 0), 1);
}
function lateFee(prem, k){ if(k<=0) return 0; return Math.max(6, Math.floor((Math.round(prem)*LATE_RATE_PCT_X10*k + 6000) / 12000)); } // minimum fee Rs 6 seen on very small premiums
function amountOn(p, payMs){ const k = lateMonths(p, payMs); const fee = lateFee(p.premium, k); return { k, fee, total: Math.round(p.premium) + fee }; }
function nextStep(p, payMs){
  const k0 = lateMonths(p, payMs);
  for(let i=1;i<=500;i++){ const t = payMs + i*86400000; if(lateMonths(p,t) > k0) return { from:t, ...amountOn(p,t) }; }
  return null;
}
function fmtDay(ms){ const d=new Date(ms); return String(d.getUTCDate()).padStart(2,'0')+'-'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]+'-'+String(d.getUTCFullYear()).slice(2); }
function todayMs(){ const n=new Date(); return utcDay(n.getFullYear(), n.getMonth(), n.getDate()); }

let migrationDone = false;

function computeDays(fup){
  // fup is "dd-mm-yy"; days overdue is recalculated every time so urgency stays accurate as days pass
  const p = (fup || "").split('-').map(Number);
  if(p.length !== 3 || p.some(isNaN)) return 0;
  const due = new Date(2000 + p[2], p[1] - 1, p[0]);
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((t - due) / 86400000);
}
function dueKey(fup){ const p = (fup||"").split('-').map(Number); return (p[2]||0)*10000 + (p[1]||0)*100 + (p[0]||0); }

const DATASET_ID = "2026-11";   // bump this whenever a new month's data is loaded; older records are cleared automatically
async function migrateIfNeeded(docs){
  // Dataset reset: any record that does not belong to the current dataset is cleared (so last month's data and
  // collected marks disappear), and every installment in SEED_DATA that is missing gets created as pending.
  // Records of the current dataset are never touched here, so collections made this month are always kept.
  if(migrationDone) return false;
  const seedMap = new Map(SEED_DATA.map(d => [d.id, d]));
  const have = new Set();
  const ops = [];
  docs.forEach(doc => {
    const data = doc.data();
    if(data.dataset === DATASET_ID){ have.add(doc.id); return; }
    const seed = seedMap.get(doc.id);
    if(seed){ ops.push({ref: doc.ref, data: {...seed, dataset: DATASET_ID, status:"pending", collectedDate:null, collectedBy:null}, overwrite:true}); have.add(doc.id); }
    else ops.push({ref: doc.ref, del:true});
  });
  SEED_DATA.forEach(d => {
    if(!have.has(d.id)) ops.push({ref: db.collection('policies').doc(d.id), data: {...d, dataset: DATASET_ID, status:"pending", collectedDate:null, collectedBy:null}, overwrite:true});
  });
  if(ops.length === 0){ migrationDone = true; return false; }
  for(let i = 0; i < ops.length; i += 400){
    const batch = db.batch();
    ops.slice(i, i + 400).forEach(op => { if(op.del) batch.delete(op.ref); else batch.set(op.ref, op.data); });
    await batch.commit();
  }
  migrationDone = true;
  return true;
}

function listenToPolicies(){
  db.collection('policies').onSnapshot(async (snap) => {
    if(!snap.metadata.fromCache){
      const changed = await migrateIfNeeded(snap.docs);
      if(changed) return; // the writes re-trigger this listener with the migrated data
    }
    state.items = snap.docs.filter(d => d.data().dataset === DATASET_ID).map(d => { const o = {...d.data(), id: d.id}; o.daysOverdue = computeDays(o.fupDate); return o; });
    state.loading = false;
    state.connStatus = "connected";
    render();
  }, (err) => {
    console.error("Snapshot listener error:", err);
    state.connStatus = "failed";
    render();
  });
}

function downloadBackup(){
  const stamp = new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
  const items = state.items.map(({daysOverdue, ...rest}) => rest);
  const save = (name, text, type) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type}));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
  };
  save(`khagram_backup_${stamp}.json`, JSON.stringify({exportedAt:new Date().toISOString(), count:items.length, items}, null, 1), 'application/json');
  const cols = ['id','policyNo','personName','groupId','groupName','mobile','mode','fupDate','premium','source','verify','status','collectedDate','collectedBy','dob','address','note'];
  const esc = v => { v = (v===undefined||v===null) ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const csv = '\ufeff' + [cols.join(',')].concat(items.map(i => cols.map(c => esc(i[c])).join(','))).join('\n');
  setTimeout(()=>save(`khagram_backup_${stamp}.csv`, csv, 'text/csv'), 400);
  toast(`Backup downloaded (${items.length} installments)`);
}
function setFilter(f){ state.filter = f; render(); }
function setSearch(v){ state.search = v; render(); }
function toggleGroup(gid){ state.openGroup = state.openGroup === gid ? null : gid; render(); }
function togglePolicyPanel(pno){ state.openPolicyPanel = state.openPolicyPanel === pno ? null : pno; render(); }

function getGroups(){
  let items = state.items;
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    items = items.filter(i => (i.personName||"").toLowerCase().includes(q) || (i.groupName||"").toLowerCase().includes(q) ||
      (i.policyNo||"").includes(q) || (i.mobile||"").includes(q));
  }
  const byGroup = {};
  items.forEach(i => {
    if(!byGroup[i.groupId]) byGroup[i.groupId] = { groupId:i.groupId, groupName:i.groupName, mobile:i.mobile||"", address:i.address||"", policies:[] };
    const g = byGroup[i.groupId];
    if(!g.mobile && i.mobile) g.mobile = i.mobile;
    if(!g.address && i.address) g.address = i.address;
    g.policies.push(i);
  });
  let groups = Object.values(byGroup).map(g => {
    g.policies.sort((a,b) => dueKey(a.fupDate) - dueKey(b.fupDate));
    const pending = g.policies.filter(p => p.status !== "collected");
    const collected = g.policies.filter(p => p.status === "collected");
    const relevant = state.filter === "collected" ? collected : (state.filter === "all" ? g.policies : pending);
    const firm = relevant.filter(p => !p.verify);
    const basis = firm.length ? firm : relevant;
    const worstDays = basis.length ? Math.max(...basis.map(p=>p.daysOverdue)) : -999;
    const totalDue = pending.filter(p => !p.verify).reduce((s,p)=>s+p.premium, 0);
    return { ...g, pending, collected, relevant, worstDays, totalDue, allDone: pending.length===0 };
  }).filter(g => g.relevant.length > 0);
  groups.sort((a,b) => b.worstDays - a.worstDays);
  return groups;
}

function buildMessage(group){
  // Only firm dues go into the customer message; entries flagged "verify" are excluded until checked.
  return buildMessageFor(group.groupName, group.pending.filter(p => !p.verify));
}
function buildMessageFor(groupName, list){
  const pending = list.slice().sort((a,b) => dueKey(a.fupDate) - dueKey(b.fupDate));
  let lines = [`Respected ${groupName},`, "",
    (pending.length===1 ? "Your following life insurance premium of LIC of India is due on the date given below" : "Your following life insurance premiums of LIC of India are due on the dates given below"), ""];
  pending.forEach(p => {
    lines.push(`Policy No.: ${p.policyNo}`);
    lines.push(`Policy Holder Name: ${(p.personName||"").replace(/^(Shri|Smt|Kum|Mast|Mr|Mrs|Ms|Dr)\.?\s+/i,'')}`);
    lines.push(`Due Date: ${p.fupDate}`);
    lines.push(`Premium: ${Math.round(p.premium)}`);
    lines.push(`GST: 0`);
    lines.push(`Total Premium: ${Math.round(p.premium)}`);
    if(p.dob) lines.push(`Date of Birth: ${p.dob}`);
    lines.push("");
  });
  lines.push("Kindly make the payment online using your credit card, debit card or net-banking account; by clicking on the link below");
  lines.push(LIC_LINK);
  lines.push("");
  lines.push("On this page please select Renewal Premium to proceed to the policy input page and enter the above details.");
  lines.push("Kindly note that GST and Late-fee if applicable shall be indicated on the LIC portal when you are making the payment.");
  lines.push("");
  lines.push("To understand the simple process of making online payment, please view the video by clicking on the link given below");
  lines.push(VIDEO_LINK);
  lines.push("");
  lines.push("Do feel free to reach out to me if you need any assistance in making the online payment.");
  lines.push("Request you to kindly inform us when the payment is made.");
  lines.push("");
  lines.push("Thanking you");
  lines.push("Best regards,");
  lines.push("Khagram Insurance");
  return lines.join("\n");
}

function renderConnBanner(){
  if(state.connStatus === "connected") return "";
  if(state.connStatus === "checking") return `<div class="sync-banner checking">Connecting…</div>`;
  return `<div class="sync-banner bad">⚠ Could not connect. Check your internet connection and reload.</div>`;
}

function render(){
  if(!configIsSet) return;
  if(state.loading){ root.innerHTML = `<div class="loading">Loading premium list…</div>`; return; }

  const activeEl = document.activeElement;
  const wasSearchFocused = activeEl && activeEl.id === 'searchBox';
  const selStart = wasSearchFocused ? activeEl.selectionStart : null;
  const selEnd = wasSearchFocused ? activeEl.selectionEnd : null;

  const groups = getGroups();
  const allItems = state.items;
  const firmPending = allItems.filter(i => i.status !== "collected" && !i.verify);
  const verifyCount = allItems.filter(i => i.status !== "collected" && i.verify).length;
  const pendingCount = firmPending.length;
  const collectedCount = allItems.filter(i => i.status === "collected").length;
  const pendingAmt = firmPending.reduce((s,i)=>s+i.premium,0);

  root.innerHTML = `
    <div class="app">
      <header>
        <h1>Khagram Insurance</h1>
        <div class="sub">Premium Tracker · November 2026 · live sync via Firebase</div>
        ${renderConnBanner()}
        <div class="stats">
          <div class="stat"><div class="n">${pendingCount}</div><div class="l">Installments Pending</div></div>
          <div class="stat"><div class="n">${fmtMoney(pendingAmt)}</div><div class="l">Outstanding</div></div>
          <div class="stat"><div class="n">${collectedCount}</div><div class="l">Collected</div></div>
        </div>
        <div class="controls">
          <input class="search" id="searchBox" placeholder="Search family, name, policy no…" value="${state.search.replace(/"/g,'&quot;')}" />
        </div>
        <div class="controls" style="margin-top:8px;">
          <div class="tabs">
            <div class="tab ${state.filter==='duedate'?'active':''}" data-f="duedate">📅 DueDate-wise</div>
            <div class="tab ${state.filter==='pending'?'active':''}" data-f="pending">Families</div>
            <div class="tab ${state.filter==='collected'?'active':''}" data-f="collected">Collected</div>
            <div class="tab ${state.filter==='all'?'active':''}" data-f="all">All</div>
          </div>
        </div>
      </header>
      <main>
        ${state.filter==='duedate' ? renderDueWise() :
          (groups.length===0 ? `<div class="empty">No families match here.</div>` : groups.map(renderGroup).join(""))}
        <div style="text-align:center;padding:10px;"><button class="btn" id="backupBtn">⬇ Download backup (JSON + CSV)</button></div>
        ${true ? `<div class="sync-note">Live-synced across everyone using this app via Firebase · build ${APP_VERSION} · ${allItems.length} installments · ${allItems.filter(i=>i.address).length} with address${verifyCount ? " · " + verifyCount + " flagged to verify" : ""}</div>` : ""}
      </main>
    </div>
    <div class="toast ${state.toastMsg?'show':''}">${state.toastMsg}</div>
  `;

  document.getElementById('backupBtn').onclick = downloadBackup;
  const payDate = document.getElementById('payDate');
  if(payDate){
    payDate.onchange = (e)=>{ const v = e.target.value; if(v){ const [y,m,d] = v.split('-').map(Number); state.payMs = Date.UTC(y,m-1,d); render(); } };
    document.getElementById('payToday').onclick = ()=>{ state.payMs = todayMs(); render(); };
  }
  document.getElementById('searchBox').oninput = (e)=> setSearch(e.target.value);
  document.querySelectorAll('.tab').forEach(el=> el.onclick = ()=> setFilter(el.dataset.f));
  document.querySelectorAll('[data-action="toggle-group"]').forEach(el=> el.onclick = ()=> toggleGroup(el.dataset.g));
  document.querySelectorAll('[data-action="collect-toggle"]').forEach(el=> el.onclick=(e)=>{ e.stopPropagation(); togglePolicyPanel(el.dataset.p); });
  document.querySelectorAll('[data-action="undo"]').forEach(el=> el.onclick=(e)=>{ e.stopPropagation(); undoCollected(el.dataset.p); });
  document.querySelectorAll('[data-action="confirm"]').forEach(el=> el.onclick=(e)=>{
    e.stopPropagation();
    const p = el.dataset.p;
    const date = document.getElementById('date-'+p).value || new Date().toISOString().slice(0,10);
    const by = document.getElementById('by-'+p).value.trim() || "Unspecified";
    markCollected(p, date, by);
  });
  document.querySelectorAll('[data-action="cancel"]').forEach(el=> el.onclick=(e)=>{ e.stopPropagation(); togglePolicyPanel(el.dataset.p); });
  document.querySelectorAll('[data-action="stop"]').forEach(el=> el.onclick=(e)=> e.stopPropagation());

  document.querySelectorAll('[data-action="copy-msg"]').forEach(el => el.onclick = async (e) => {
    e.stopPropagation();
    const g = getGroups().find(x => x.groupId === el.dataset.g);
    if(!g) return;
    try{ await navigator.clipboard.writeText(buildMessage(g)); toast("Message copied — paste it into WhatsApp"); }
    catch(err){ toast("Could not copy automatically"); }
  });

  document.querySelectorAll('[data-action="copy-one"]').forEach(el => el.onclick = async (e) => {
    e.stopPropagation();
    const p = state.items.find(x => x.id === el.dataset.p);
    if(!p) return;
    try{ await navigator.clipboard.writeText(buildMessageFor(p.groupName, [p])); toast("Message copied — paste it into WhatsApp"); }
    catch(err){ toast("Could not copy automatically"); }
  });

  if(wasSearchFocused){
    const newSearchEl = document.getElementById('searchBox');
    if(newSearchEl){
      newSearchEl.focus();
      try{ newSearchEl.setSelectionRange(selStart, selEnd); }catch(e){}
    }
  }
}

function renderGroup(g){
  const open = state.openGroup === g.groupId;
  const bc = g.allDone ? "done" : bucketClass(g.worstDays);
  const billable = g.pending.filter(p => !p.verify).length;
  const encodedMsg = billable > 0 ? encodeURIComponent(buildMessage(g)) : "";
  const tooLong = encodedMsg.length > 3500;   // very long pre-filled links can fail; open the chat and paste the copied message instead
  const waLink = (g.mobile && billable > 0) ? `https://wa.me/91${g.mobile}${tooLong ? '' : '?text=' + encodedMsg}` : null;
  const telLink = g.mobile ? `tel:${g.mobile}` : null;

  return `
    <div class="fcard ${bc}">
      <div class="fhead" data-action="toggle-group" data-g="${g.groupId}">
        <div>
          <div class="fname">${g.groupName}</div>
          <div class="fmeta">${g.relevant.length} installment${g.relevant.length===1?'':'s'}${g.mobile ? ' · '+g.mobile : ' · no mobile on file'}</div>
          <span class="badge ${bc}">${g.allDone ? 'All Collected' : bucketLabel(g.worstDays)}</span>
        </div>
        <div>
          <div class="famt">${fmtMoney(g.totalDue)}</div>
          <div class="fcount">${open ? '▲ hide' : '▼ details'}</div>
        </div>
      </div>
      ${open ? `
        <div class="fbody">
          ${g.relevant.map(renderPolicyRow).join("")}
        </div>
        <div class="factions" data-action="stop">
          ${telLink ? `<a class="btn" href="${telLink}">Call</a>` : ""}
          ${billable > 0 ? `<a class="btn" data-action="copy-msg" data-g="${g.groupId}">Copy message</a>` : ""}
          ${waLink ? `<a class="btn wa" href="${waLink}" target="_blank">${tooLong ? 'Open WhatsApp (paste copied msg)' : 'Send WhatsApp reminder'}</a>` : ""}
        </div>
      ` : ""}
    </div>`;
}

function mobileFor(p){
  if(p.mobile) return p.mobile;
  const o = state.items.find(x => x.groupId === p.groupId && x.mobile);
  return o ? o.mobile : "";
}

function renderDueWise(){
  let items = state.items.filter(i => i.status !== "collected");
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    items = items.filter(i => (i.personName||"").toLowerCase().includes(q) || (i.groupName||"").toLowerCase().includes(q) ||
      (i.policyNo||"").includes(q) || (i.mobile||"").includes(q));
  }
  items.sort((a,b) => dueKey(a.fupDate) - dueKey(b.fupDate) || (a.groupName||"").localeCompare(b.groupName||""));
  if(!items.length) return `<div class="empty">No outstanding premiums match here.</div>`;
  const firm = items.filter(i => !i.verify);
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  if(state.payMs === null) state.payMs = todayMs();
  const payISO = new Date(state.payMs).toISOString().slice(0,10);
  const withFee = firm.reduce((s,p)=>s+amountOn(p,state.payMs).total,0);
  let html = `<div class="fcard" style="padding:10px 12px;margin:8px 0;">
      <label style="font-weight:600;font-size:13px;">If customers pay on:</label>
      <input type="date" id="payDate" value="${payISO}" style="margin-left:8px;padding:6px;font-size:14px;" />
      <button class="btn" id="payToday" style="margin-left:6px;">Today</button>
      <div class="pmeta" style="margin-top:6px;">Late fee = premium × 11.2% p.a. ÷ 12 per month late (grace: up to same date next month; 15 days for monthly/SSS). Premium amounts are as per your list; late fee is an estimate — LIC portal shows the final figure.</div>
    </div>
    <div class="sync-note" style="text-align:left;padding:8px 10px;">${items.length} outstanding installments · oldest due date first · premiums ${fmtMoney(firm.reduce((s,p)=>s+p.premium,0))} · <b>with late fee on ${fmtDay(state.payMs)}: ${fmtMoney(withFee)}</b> (excluding verify-first)</div>`;
  let lastMonth = "";
  items.forEach(p => {
    const d = (p.fupDate||"").split('-');
    const mk = (MONTHS[(+d[1]||1)-1]||"") + " 20" + (d[2]||"");
    if(mk !== lastMonth){
      const cnt = items.filter(x => { const e=(x.fupDate||"").split('-'); return e[1]===d[1] && e[2]===d[2]; });
      html += `<div style="padding:14px 10px 4px;font-weight:700;color:var(--ink);">${mk} <span style="font-weight:400;color:var(--ink-soft);font-size:12.5px;">· ${cnt.length} due · ${fmtMoney(cnt.filter(x=>!x.verify).reduce((s,x)=>s+x.premium,0))}</span></div>`;
      lastMonth = mk;
    }
    html += renderDueRow(p);
  });
  return html;
}

function lateBlock(p){
  const a = amountOn(p, state.payMs);
  const nx = nextStep(p, state.payMs);
  const main = a.k === 0
    ? `Pay on ${fmtDay(state.payMs)}: <b>${fmtMoney(a.total)}</b> <span style="color:var(--ink-soft)">(no late fee – within grace)</span>`
    : `Pay on ${fmtDay(state.payMs)}: <b style="color:var(--danger)">${fmtMoney(a.total)}</b> <span style="color:var(--ink-soft)">(premium ${fmtMoney(p.premium)} + late fee ${fmtMoney(a.fee)} · ${a.k} month${a.k===1?'':'s'})</span>`;
  const next = nx ? `<div class="pmeta">From ${fmtDay(nx.from)}: ${fmtMoney(nx.total)} (late fee ${fmtMoney(nx.fee)})</div>` : "";
  return `<div class="pmeta" style="margin-top:4px;">${main}</div>${next}`;
}

function renderDueRow(p){
  const mobile = mobileFor(p);
  const msg = p.verify ? "" : encodeURIComponent(buildMessageFor(p.groupName, [p]));
  const tooLong = msg.length > 3500;
  const waLink = (mobile && !p.verify) ? `https://wa.me/91${mobile}${tooLong ? '' : '?text=' + msg}` : null;
  const bc = p.verify ? "" : bucketClass(p.daysOverdue);
  const dayTag = p.daysOverdue > 0 ? `<b style="color:var(--danger)">${p.daysOverdue}d overdue</b>` : (p.daysOverdue === 0 ? 'due today' : `due in ${-p.daysOverdue}d`);
  const panelOpen = state.openPolicyPanel === p.id;
  const today = new Date().toISOString().slice(0,10);
  const verifyBlock = p.verify ? `<div class="verify-note">⚠ Verify first: ${p.note} (reminder disabled until verified)</div>` : "";
  let collect;
  if(panelOpen){
    collect = `
      <div class="collect-panel">
        <label>Date collected</label>
        <input type="date" id="date-${p.id}" value="${today}" max="${today}" />
        <label>Collected by</label>
        <select id="by-${p.id}">
          <option value="">Choose…</option><option value="Minakshiben">Minakshiben</option>
          <option value="Prakashbhai">Prakashbhai</option><option value="Me">Me</option><option value="Other">Other</option>
        </select>
        <div class="confirm-row">
          <button class="btn btn-confirm" data-action="confirm" data-p="${p.id}">Confirm collected</button>
          <button class="btn btn-cancel" data-action="cancel" data-p="${p.id}">Cancel</button>
        </div>
      </div>`;
  } else {
    collect = `
      <div class="prow-actions" style="flex-wrap:wrap;gap:6px;" data-action="stop">
        ${mobile ? `<a class="btn" href="tel:${mobile}">Call</a>` : ""}
        ${!p.verify ? `<a class="btn" data-action="copy-one" data-p="${p.id}">Copy</a>` : ""}
        ${waLink ? `<a class="btn wa" href="${waLink}" target="_blank">${tooLong ? 'Open WhatsApp' : 'Send reminder'}</a>` : (!p.verify && !mobile ? `<span class="ppolicyno">No mobile on file</span>` : "")}
        <button class="btn btn-collect" data-action="collect-toggle" data-p="${p.id}">Mark Collected</button>
      </div>`;
  }
  return `
    <div class="fcard ${bc}" style="margin-bottom:8px;">
      <div class="prow ${p.verify ? 'verify' : ''}" style="padding:10px 12px;">
        <div class="prow-top">
          <div>
            <div class="pname">${p.groupName}</div>
            <div class="pmeta">${p.personName} · Policy ${p.policyNo}</div>
            <div class="pmeta">${p.mode} · Due <b>${p.fupDate}</b> · ${dayTag}</div>
            <div class="pmeta">${sourceLabel(p.source)}${mobile ? ' · ' + mobile : ''}</div>
          </div>
          <div class="pamt">${fmtMoney(p.premium)}</div>
        </div>
        ${lateBlock(p)}
        ${verifyBlock}
        ${collect}
      </div>
    </div>`;
}

function sourceLabel(s){ return s === '15730811' ? 'Minakshiben agency' : (s === '0130981B' ? 'Prakash agency' : 'Other agency'); }

function renderPolicyRow(p){
  const today = new Date().toISOString().slice(0,10);
  const panelOpen = state.openPolicyPanel === p.id;
  const isCollected = p.status === "collected";
  let actionBlock = "";
  if(isCollected){
    actionBlock = `
      <div class="prow-actions">
        <span class="collected-tag">✓ Collected ${p.collectedDate} by ${p.collectedBy}</span>
        <button class="btn btn-undo" data-action="undo" data-p="${p.id}">Undo</button>
      </div>`;
  } else if(panelOpen){
    actionBlock = `
      <div class="collect-panel">
        <label>Date collected</label>
        <input type="date" id="date-${p.id}" value="${today}" max="${today}" />
        <label>Collected by</label>
        <select id="by-${p.id}">
          <option value="">Choose…</option>
          <option value="Minakshiben">Minakshiben</option>
          <option value="Prakashbhai">Prakashbhai</option>
          <option value="Me">Me</option>
          <option value="Other">Other</option>
        </select>
        <div class="confirm-row">
          <button class="btn btn-confirm" data-action="confirm" data-p="${p.id}">Confirm collected</button>
          <button class="btn btn-cancel" data-action="cancel" data-p="${p.id}">Cancel</button>
        </div>
      </div>`;
  } else {
    actionBlock = `
      <div class="prow-actions">
        <span class="ppolicyno">Policy ${p.policyNo}${p.dob ? ' · DOB ' + p.dob : ''}</span>
        <button class="btn btn-collect" data-action="collect-toggle" data-p="${p.id}">Mark Collected</button>
      </div>`;
  }
  const verifyBlock = (p.verify && !isCollected) ? `<div class="verify-note">⚠ Verify first: ${p.note}</div>` : "";
  const dayTag = p.daysOverdue > 0 ? ` · <b style="color:var(--danger)">${p.daysOverdue}d overdue</b>` : (p.daysOverdue === 0 ? ' · due today' : '');
  return `
    <div class="prow ${isCollected?'collected':''} ${p.verify && !isCollected ? 'verify' : ''}">
      <div class="prow-top">
        <div>
          <div class="pname">${p.personName}</div>
          <div class="pmeta">${p.mode} · Due ${p.fupDate}${dayTag} · ${sourceLabel(p.source)}</div>
        </div>
        <div class="pamt">${fmtMoney(p.premium)}</div>
      </div>
      ${verifyBlock}
      ${actionBlock}
    </div>`;
}

if(configIsSet){
  root.innerHTML = `<div class="loading">Connecting…</div>`;
  initFirebase();
} else {
  renderSetupScreen();
}
</script>
</body>
</html>
